name: attendance_management
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  get: ^4.6.6
  intl: ^0.20.2
  collection: ^1.18.0
  hugeicons: ^1.1.0
  shared_preferences: ^2.2.2
  local_auth: ^2.1.6
  firebase_core: ^4.5.0
  firebase_messaging: ^16.1.2
  flutter_local_notifications: ^21.0.0
  pdf: ^3.12.0
  printing: ^5.14.3
  path_provider: ^2.1.5
  share_plus: ^12.0.1
  url_launcher: ^6.3.2
  file_picker: ^8.1.5
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/ic_launcher.png

  fonts:
    - family: Janat
      fonts:
        - asset: assets/fonts/janat.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/ic_launcher.png"
  web:
    generate: true
    image_path: "assets/ic_launcher.png"
  windows:
    generate: true
    image_path: "assets/ic_launcher.png"
